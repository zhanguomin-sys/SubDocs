<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAutoAPI中转快速接入助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="flow" viewBox="0 0 420 220" preserveAspectRatio="xMaxYMin slice" aria-hidden="true">
  <defs>
    <linearGradient id="flow-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset=".45" stop-color="#0891b2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#flow-ink)" stroke-linecap="round">
    <path d="M236 2 C292 6 318 40 352 52" stroke-width="1.2"/>
    <path d="M228 30 C292 32 318 48 352 52" stroke-width="1.4"/>
    <path d="M240 86 C298 78 322 60 352 52" stroke-width="1.2"/>
    <path d="M268 128 C308 108 328 66 352 52" stroke-width="1"/>
    <path d="M352 52 C380 52 400 60 430 74" stroke-width="2.2"/>
  </g>
  <circle cx="352" cy="52" r="4" fill="#0891b2" fill-opacity=".55"/>
  <circle cx="352" cy="52" r="10" fill="none" stroke="#0891b2" stroke-opacity=".22"/>
</svg>

<main class="shell" id="shell" data-tool="codex">
  <header class="brand">
    <img class="logo" src="logo.png" alt="">
    <div>
      <h1>My<span class="good">Auto</span>API</h1>
      <p>中转快速接入助手</p>
    </div>
    <div class="apps" role="group" aria-label="接入哪个软件">
      <button class="app-tab" id="tab-codex" type="button" aria-pressed="true">Codex</button>
      <button class="app-tab" id="tab-claude" type="button" aria-pressed="false">Claude</button>
    </div>
  </header>

  <section class="status" id="status" data-state="loading">
    <span class="status-icon" aria-hidden="true">
      <svg class="i-ok" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7"/></svg>
      <svg class="i-none" viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/></svg>
      <svg class="i-other" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.6v.1"/></svg>
      <svg class="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      <svg class="i-models" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <svg class="i-claude" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>
    </span>
    <div class="status-text">
      <span class="status-label" id="status-label">Codex 状态</span>
      <strong id="status-title">正在读取…</strong>
      <span class="status-key"><span class="status-name" id="status-name" hidden></span><code id="status-key"></code></span>
      <div class="get-app" id="get-app" hidden>
        <button class="pill solid" id="get-official" type="button">官网下载</button>
        <button class="pill" id="get-group" type="button">群文件下载</button>
      </div>
    </div>
  </section>


  <form class="connect" id="connect-form" autocomplete="off">
    <label class="field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M16 7l3 3M18.5 4.5l2 2"/></svg>
      <input id="key" type="text" placeholder="粘贴 API Key" spellcheck="false" aria-label="粘贴 API Key">
    </label>
    <button class="primary" id="connect" type="submit">
      <span class="spinner" aria-hidden="true"></span>
      <span id="connect-label">一键连接 Codex</span>
    </button>
  </form>

  <div class="notice" id="notice" role="status" aria-live="polite" hidden>
    <span class="notice-icon" aria-hidden="true"></span>
    <div class="notice-body">
      <p id="notice-text"></p>
      <button class="notice-action" id="notice-action" type="button" hidden>打开 MyAutoAPI 网站</button>
    </div>
  </div>

  <nav class="tools" id="tools" aria-label="其他工具">
    <button class="tool-entry" id="go-codex" type="button" data-target="codex">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      <span>返回 Codex 接入</span>
    </button>
    <button class="tool-entry" id="go-image" type="button" data-target="image">
      <span class="tool-dot" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      <span id="go-image-label">安装生图工具</span>
    </button>
    <button class="tool-entry" id="go-models" type="button" data-target="models">
      <span class="tool-dot" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span id="go-models-label">导入国产模型</span>
    </button>
  </nav>

  <section class="qq" id="qq">
    <div class="qq-tile"><img src="penguin.png" alt=""></div>
    <div class="qq-text">
      <div class="qq-label">QQ 交流群</div>
      <div class="qq-number">685861462</div>
      <div class="qq-gift">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C9.5 3 11 5 12 8c1-3 2.5-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        新人进群领 2 元
      </div>
      <div class="qq-files">群文件有 ChatGPT、Claude 安装包</div>
    </div>
    <div class="qq-actions">
      <button class="pill" id="copy-qq" type="button">复制群号</button>
      <button class="pill solid" id="join-qq" type="button">加入群聊</button>
    </div>
  </section>

  <footer>
    <div class="links">
      <button class="ghost" id="open-site" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        打开官网
      </button>
      <button class="text" id="remove-models" type="button" hidden>移除国产模型</button>
      <span class="tip-anchor" id="restore-anchor">
        <button class="text" id="restore" type="button" aria-describedby="restore-tip">恢复官方登录</button>
        <span class="tip" id="restore-tip" role="tooltip">取消中转站连接：Codex 改回用 OpenAI 官方账号登录，并关闭正在运行的 Codex。</span>
      </span>
    </div>
    <p class="version">版本 <span id="version"></span></p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
