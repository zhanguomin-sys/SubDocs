<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导入链接测试页</title>
<style>
  :root{--fg:#0b1220;--muted:#566275;--border:#dfe5ec;--primary:#0d9488}
  *{box-sizing:border-box}
  body{margin:0;padding:32px 16px;background:#f4f7fa;color:var(--fg);font:15px/1.6 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
  main{max-width:640px;margin:0 auto}
  h1{margin:0 0 4px;font-size:22px}
  p{margin:0 0 20px;color:var(--muted)}
  label{display:block;margin:14px 0 6px;font-weight:600}
  input{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font:14px Consolas,monospace}
  .links{margin-top:22px;display:grid;gap:10px}
  .links a{display:block;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--border);color:var(--fg);text-decoration:none}
  .links a:hover{border-color:var(--primary)}
  .links a b{display:block}
  .links a code{display:block;margin-top:4px;color:var(--muted);font-size:12px;word-break:break-all}
  .links a.main{background:linear-gradient(135deg,#0d9488,#0891b2);color:#fff;border:0}
  .links a.main code{color:rgba(255,255,255,.85)}
</style>
</head>
<body>
<main>
  <h1>MyAutoAPI中转快速接入助手 · 导入链接测试</h1>
  <p>本页只在本机使用，不发布到文档站。Windows 上先双击助手一次完成登记；Mac 上先把 .app 放进「应用程序」并双击打开一次。然后点下面的链接。</p>
  <label for="key">密钥（sk- 开头）</label>
  <input id="key" placeholder="sk-..." autocomplete="off" spellcheck="false">
  <label for="name">密钥名称（可选，只用来显示）</label>
  <input id="name" placeholder="例如：测试密钥" autocomplete="off">
  <div class="links" id="links"></div>
</main>
<script>
  const cases = [
    ['main', '一键导入（正常链接）', (k, n) => `myautoapi://import?v=1&app=codex&key=${k}${n}`],
    ['', '多一个斜杠', (k, n) => `myautoapi://import/?v=1&app=codex&key=${k}${n}`],
    ['', '缺少密钥 → 导入链接不完整', (k, n) => `myautoapi://import?v=1&app=codex${n}`],
    ['', '版本过高 v=2 → 请下载新版助手', (k, n) => `myautoapi://import?v=2&app=codex&key=${k}${n}`],
    ['main', '一键导入 Claude（Windows 连接 Claude 桌面版；Mac 版提示只有 Windows 支持）', (k, n) => `myautoapi://import?v=1&app=claude&key=${k}${n}`],
    ['', '其他应用 app=gemini → 请下载新版助手', (k, n) => `myautoapi://import?v=1&app=gemini&key=${k}${n}`],
    ['', '带地址参数 → 导入链接不完整', (k, n) => `myautoapi://import?v=1&app=codex&key=${k}${n}&base_url=${encodeURIComponent('https://example.com')}`],
  ];
  function render() {
    const key = encodeURIComponent(document.getElementById('key').value.trim());
    const nameValue = document.getElementById('name').value.trim();
    const name = nameValue ? `&name=${encodeURIComponent(nameValue)}` : '';
    const box = document.getElementById('links');
    box.textContent = '';
    for (const [style, title, build] of cases) {
      const href = build(key, name);
      const link = document.createElement('a');
      link.className = style;
      link.href = href;
      const heading = document.createElement('b');
      heading.textContent = title;
      const code = document.createElement('code');
      code.textContent = href;
      link.append(heading, code);
      box.append(link);
    }
  }
  document.getElementById('key').addEventListener('input', render);
  document.getElementById('name').addEventListener('input', render);
  render();
</script>
</body>
</html>
